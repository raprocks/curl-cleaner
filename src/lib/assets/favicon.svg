<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Curl Cleaner">
	<title>Curl Cleaner</title>
	<rect width="32" height="32" rx="7" fill="#166b2b"/>
	<rect width="32" height="32" rx="7" fill="url(#shine)" opacity="0.35"/>
	<defs>
		<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#fff"/>
			<stop offset="45%" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
	</defs>
	<!-- terminal prompt -->
	<path
		d="M7.5 9.5 L10.5 12.5 L7.5 15.5"
		stroke="#fff"
		stroke-width="2"
		fill="none"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<!-- stripped browser headers -->
	<rect x="12" y="8.5" width="13" height="2.5" rx="1.25" fill="#fff" opacity="0.22"/>
	<rect x="12" y="13" width="9.5" height="2.5" rx="1.25" fill="#fff" opacity="0.22"/>
	<!-- kept essentials -->
	<rect x="7" y="17.5" width="18" height="2.5" rx="1.25" fill="#fff"/>
	<rect x="7" y="22" width="13.5" height="2.5" rx="1.25" fill="#fff"/>
</svg>
