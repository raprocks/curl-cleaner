name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          PUBLIC_SITE_URL: https://curl-cleaner.rohitpatil.me
          PUBLIC_GA_MEASUREMENT_ID: G-Q1GLTHQDQX

      - name: Verify build output
        run: test -f build/index.html
